<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>행사갤러리 | 유캔스테이지</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="page">

  <header class="site-header">
    <div class="header-inner">
      <a href="/" class="logo-link">
        <img src="/assets/logo.png" alt="유캔스테이지">
      </a>

      <button class="menu-btn" aria-label="메뉴 열기">
        <span></span><span></span><span></span>
      </button>

      <nav class="desktop-nav">
        <a href="/about.html" class="nav-link">회사소개</a>
        <a href="/rental-products.html" class="nav-link">렌탈상품</a>
        <a href="/system-items.html" class="nav-link">시스템품목</a>
        <a href="/gallery.html" class="nav-link active">행사갤러리</a>
        <a href="/#contact" class="cta-btn">무료 견적 문의</a>
      </nav>
    </div>

    <nav class="mobile-nav">
      <a href="/about.html" class="nav-link">회사소개</a>
      <a href="/rental-products.html" class="nav-link">렌탈상품</a>
      <a href="/system-items.html" class="nav-link">시스템품목</a>
      <a href="/gallery.html" class="nav-link active">행사갤러리</a>
      <a href="/#contact" class="cta-btn">무료 견적 문의</a>
    </nav>
  </header>

  <div class="simple-page">
    <p class="eyebrow" style="display:block;margin:0 0 16px;">EVENT GALLERY</p>
    <h1>행사갤러리</h1>
    <p class="lead" style="margin-bottom:48px;">유캔스테이지가 함께한 행사 현장입니다.</p>

    <div class="gallery-grid" id="gallery-grid"></div>
  </div>

  <div class="lightbox" id="lightbox">
    <button type="button" class="lightbox-close" id="lightbox-close" aria-label="닫기">✕</button>
    <button type="button" class="lightbox-nav lightbox-prev" id="lightbox-prev" aria-label="이전 사진">‹</button>
    <div class="lightbox-content">
      <img id="lightbox-img" src="" alt="">
      <p class="lightbox-caption" id="lightbox-caption"></p>
    </div>
    <button type="button" class="lightbox-nav lightbox-next" id="lightbox-next" aria-label="다음 사진">›</button>
  </div>

  <footer class="site-footer">
    <div class="site-footer-inner">
      <p class="footer-links">개인정보처리방침<span class="sep">|</span>이용약관<span class="sep">|</span>이메일무단수집거부</p>
      <p class="footer-info">
        대표 : 김대현 &nbsp;|&nbsp; 주소 : 서울특별시 금천구 가산디지털1로 19, 1609호 유캔엔터<br>
        연락처 : 010-8986-8450 &nbsp;|&nbsp; 사업자등록번호 : 720-47-00808
      </p>
    </div>
  </footer>

</div>

<script src="/nav.js"></script>
<script>
(function () {
  const grid = document.getElementById('gallery-grid');
  const lightbox = document.getElementById('lightbox');
  const lightboxImg = document.getElementById('lightbox-img');
  const lightboxCaption = document.getElementById('lightbox-caption');

  let photos = [];
  let captions = {};
  let current = 0;

  function escapeHTML(str) {
    return String(str).replace(/[&<>"']/g, (c) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
    }[c]));
  }

  function showPhoto(index) {
    current = (index + photos.length) % photos.length;
    const photo = photos[current];
    lightboxImg.src = photo.url;
    lightboxCaption.textContent = captions[photo.pathname] || '';
  }

  function openLightbox(index) {
    showPhoto(index);
    lightbox.classList.add('open');
  }

  function closeLightbox() {
    lightbox.classList.remove('open');
  }

  document.getElementById('lightbox-close').addEventListener('click', closeLightbox);
  document.getElementById('lightbox-prev').addEventListener('click', () => showPhoto(current - 1));
  document.getElementById('lightbox-next').addEventListener('click', () => showPhoto(current + 1));
  lightbox.addEventListener('click', (e) => {
    if (e.target === lightbox) closeLightbox();
  });
  document.addEventListener('keydown', (e) => {
    if (!lightbox.classList.contains('open')) return;
    if (e.key === 'Escape') closeLightbox();
    if (e.key === 'ArrowLeft') showPhoto(current - 1);
    if (e.key === 'ArrowRight') showPhoto(current + 1);
  });

  Promise.all([
    fetch('/api/photos?slot=gallery').then((r) => r.json()),
    fetch('/api/captions?slot=gallery').then((r) => r.json()).catch(() => ({ captions: {} })),
  ]).then(([photosData, captionsData]) => {
    photos = photosData.photos || [];
    captions = captionsData.captions || {};

    if (photos.length === 0) {
      grid.innerHTML = '<p class="gallery-empty">등록된 사진이 없습니다.</p>';
      return;
    }

    grid.innerHTML = photos
      .map((p, i) => `
        <div class="gallery-photo clickable" data-index="${i}">
          <img src="${p.url}" alt="">
          ${captions[p.pathname] ? `<p class="gallery-photo-caption">${escapeHTML(captions[p.pathname])}</p>` : ''}
        </div>
      `)
      .join('');

    grid.querySelectorAll('.gallery-photo').forEach((el) => {
      el.addEventListener('click', () => openLightbox(Number(el.dataset.index)));
    });
  }).catch(() => {
    grid.innerHTML = '<p class="gallery-empty">등록된 사진이 없습니다.</p>';
  });
})();
</script>
</body>
</html>
