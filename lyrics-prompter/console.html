<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>가사 프롬프터 - 콘솔</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', 'Segoe UI', sans-serif;
  background: #1c1e24;
  color: #e8e9ee;
  height: 100vh;
  overflow: hidden;
}

.layout { display: flex; height: 100vh; }

.sidebar {
  width: 300px;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  background: #16171c;
  border-right: 1px solid #2a2c34;
  padding: 16px;
}

.sidebar-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
}

.sidebar-header h1 {
  font-size: 16px;
  margin: 0;
  color: #a8abb8;
  font-weight: 600;
}

.search-input {
  width: 100%;
  padding: 8px 10px;
  border-radius: 6px;
  border: 1px solid #2a2c34;
  background: #22242c;
  color: #e8e9ee;
  margin-bottom: 12px;
  font-size: 13px;
}

.song-list { list-style: none; margin: 0; padding: 0; overflow-y: auto; flex: 1; }

.song-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 12px;
  border-radius: 6px;
  cursor: pointer;
  margin-bottom: 4px;
  transition: background 0.12s;
}

.song-item:hover { background: #22242c; }
.song-item.active { background: #2e3140; }
.song-item.on-air { background: #2a3f2e; }

.song-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; }

.song-item-live-badge {
  font-size: 10px;
  color: #6cd97e;
  border: 1px solid #3a6b42;
  border-radius: 4px;
  padding: 1px 5px;
  flex-shrink: 0;
  margin-left: 6px;
}

.editor { flex: 1; display: flex; flex-direction: column; padding: 20px 24px; min-width: 0; }

.editor-header { display: flex; gap: 12px; margin-bottom: 12px; }

.title-input {
  flex: 1;
  font-size: 20px;
  padding: 10px 12px;
  border-radius: 6px;
  border: 1px solid #2a2c34;
  background: #22242c;
  color: #e8e9ee;
}

.editor-actions { display: flex; gap: 8px; }

.lyrics-input {
  flex: 1;
  width: 100%;
  resize: none;
  border-radius: 8px;
  border: 1px solid #2a2c34;
  background: #22242c;
  color: #e8e9ee;
  padding: 16px;
  font-size: 16px;
  line-height: 1.7;
  font-family: inherit;
}

.prompter-bar {
  margin-top: 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: #16171c;
  border: 1px solid #2a2c34;
  border-radius: 8px;
  padding: 12px 16px;
  flex-wrap: wrap;
  gap: 8px;
}

.prompter-status { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #a8abb8; }

.dot { width: 8px; height: 8px; border-radius: 50%; background: #565a68; }
.prompter-status.live .dot { background: #6cd97e; box-shadow: 0 0 6px #6cd97e; }

.prompter-controls { display: flex; align-items: center; gap: 10px; font-size: 13px; color: #a8abb8; flex-wrap: wrap; }

#font-size-label { min-width: 44px; text-align: center; color: #e8e9ee; }

.btn { border: none; border-radius: 6px; padding: 9px 14px; font-size: 13px; cursor: pointer; font-weight: 500; }
.btn-primary { background: #4c6ef5; color: white; }
.btn-primary:hover { background: #3d5ce0; }
.btn-danger { background: transparent; color: #e5636b; border: 1px solid #5a2a2e; }
.btn-danger:hover { background: #2a1c1e; }
.btn-ghost { background: #22242c; color: #e8e9ee; border: 1px solid #2a2c34; padding: 6px 10px; }
.btn-ghost:hover { background: #2a2c34; }
.btn-accent { background: #2f9e44; color: white; padding: 9px 16px; }
.btn-accent:hover { background: #268b3a; }
.btn:disabled { opacity: 0.5; cursor: default; }

.artist-input {
  width: 200px;
  flex-shrink: 0;
  font-size: 14px;
  padding: 10px 12px;
  border-radius: 6px;
  border: 1px solid #2a2c34;
  background: #22242c;
  color: #e8e9ee;
}

.search-status {
  margin: -6px 0 10px;
  font-size: 12.5px;
  color: #a8abb8;
}

.search-status.error { color: #e5636b; }
.search-status.success { color: #6cd97e; }

.sync-section {
  margin-bottom: 12px;
  padding: 12px;
  border: 1px solid #2a2c34;
  border-radius: 8px;
  background: #1a1c22;
}

.sync-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 8px;
  font-size: 13px;
  color: #a8abb8;
}

.lrc-input {
  width: 100%;
  height: 90px;
  resize: vertical;
  border-radius: 6px;
  border: 1px solid #2a2c34;
  background: #22242c;
  color: #e8e9ee;
  padding: 10px 12px;
  font-size: 13px;
  font-family: Consolas, 'SFMono-Regular', monospace;
  line-height: 1.5;
  box-sizing: border-box;
}

.attach-audio-row { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
.file-label { cursor: pointer; }
.audio-file-name { font-size: 12.5px; color: #a8abb8; }

.audio-transport { flex-basis: 100%; margin-bottom: 4px; }
.audio-transport audio { width: 100%; height: 34px; }

.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.7);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1000;
}

.modal-overlay[hidden] { display: none; }

.modal-panel {
  width: min(640px, 92vw);
  max-height: 88vh;
  overflow-y: auto;
  background: #1c1e24;
  border: 1px solid #2a2c34;
  border-radius: 12px;
  padding: 20px 24px;
}

.modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.modal-header h2 { margin: 0; font-size: 17px; color: #e8e9ee; }

.tap-progress { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; font-size: 13px; color: #a8abb8; }
.tap-progress select { background: #22242c; color: #e8e9ee; border: 1px solid #2a2c34; border-radius: 6px; padding: 4px 8px; }

#sync-audio { width: 100%; margin-bottom: 18px; }

.tap-lines { text-align: center; margin-bottom: 18px; }
.tap-line { padding: 6px 0; word-break: keep-all; }
.tap-line-prev, .tap-line-next { color: #565a68; font-size: 15px; min-height: 1.4em; }
.tap-line-current { color: #ffffff; font-size: 22px; font-weight: 700; margin: 6px 0; min-height: 1.4em; }

.tap-actions { display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }

.tap-hint { text-align: center; font-size: 12.5px; color: #7d818f; margin: 0; }
</style>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-header">
        <h1>곡 목록</h1>
        <button id="new-song-btn" class="btn btn-primary">+ 새 곡</button>
      </div>
      <input id="search-input" class="search-input" type="text" placeholder="곡 제목 검색..." />
      <ul id="song-list" class="song-list"></ul>
    </aside>

    <main class="editor">
      <div class="editor-header">
        <input id="title-input" class="title-input" type="text" placeholder="곡 제목" />
        <input id="artist-input" class="artist-input" type="text" placeholder="가수 (검색용)" />
        <div class="editor-actions">
          <button id="search-lyrics-btn" class="btn btn-ghost">가사 자동 검색</button>
          <button id="save-btn" class="btn btn-primary">저장</button>
          <button id="delete-btn" class="btn btn-danger" hidden>삭제</button>
        </div>
      </div>
      <div id="search-status" class="search-status" hidden></div>

      <textarea id="lyrics-input" class="lyrics-input" placeholder="가사를 붙여넣거나 입력하세요... (또는 위에서 자동 검색)"></textarea>

      <div class="sync-section">
        <div class="sync-header">
          <label>노래방처럼 자동 진행 (선택 — 싱크 가사 + 음원 필요)</label>
          <div style="display: flex; gap: 8px;">
            <button id="start-tap-sync-btn" class="btn btn-ghost">탭으로 싱크 찍기</button>
            <button id="search-lrc-btn" class="btn btn-ghost">싱크 가사 자동 검색</button>
          </div>
        </div>
        <div id="lrc-status" class="search-status" hidden></div>
        <textarea id="lrc-input" class="lrc-input" placeholder="싱크 가사(LRC) - 예: [00:12.34]가사 한 줄. 자동 검색하거나 .lrc 파일 내용을 그대로 붙여넣으세요."></textarea>
        <div class="attach-audio-row">
          <label class="btn btn-ghost file-label">
            음원 파일 선택
            <input id="audio-file-input" type="file" accept="audio/*" hidden />
          </label>
          <span id="audio-file-name" class="audio-file-name">첨부된 음원 없음 (새로고침하면 다시 선택해야 해요)</span>
        </div>
      </div>

      <div class="prompter-bar">
        <div class="audio-transport" id="audio-transport" hidden>
          <audio id="audio-player" controls></audio>
        </div>
        <div class="prompter-status">
          <span class="dot"></span>
          <span id="now-showing">프롬프터: 대기 중</span>
        </div>
        <div class="prompter-controls">
          <button id="open-prompter-btn" class="btn btn-ghost">프롬프터 창 열기</button>
          <label>글자 크기</label>
          <button id="font-minus-btn" class="btn btn-ghost">−</button>
          <span id="font-size-label">64px</span>
          <button id="font-plus-btn" class="btn btn-ghost">+</button>
          <button id="clear-prompter-btn" class="btn btn-ghost">지우기</button>
          <button id="send-btn" class="btn btn-accent">▶ 프롬프터로 보내기</button>
        </div>
      </div>
    </main>
  </div>

  <div id="tap-sync-modal" class="modal-overlay" hidden>
    <div class="modal-panel">
      <div class="modal-header">
        <h2>탭으로 싱크 찍기</h2>
        <button id="tap-close-btn" class="btn btn-ghost">닫기</button>
      </div>

      <div class="tap-progress">
        <span id="tap-progress-label">0 / 0줄</span>
        <select id="tap-speed-select">
          <option value="1">1.0배속</option>
          <option value="0.75">0.75배속</option>
          <option value="0.5">0.5배속</option>
        </select>
      </div>

      <audio id="sync-audio" controls></audio>

      <div class="tap-lines">
        <div id="tap-line-prev" class="tap-line tap-line-prev"></div>
        <div id="tap-line-current" class="tap-line tap-line-current"></div>
        <div id="tap-line-next" class="tap-line tap-line-next"></div>
      </div>

      <div class="tap-actions">
        <button id="tap-undo-btn" class="btn btn-ghost">↩ 되돌리기</button>
        <button id="tap-reset-btn" class="btn btn-ghost">처음부터</button>
        <button id="tap-btn" class="btn btn-accent">TAP (스페이스바)</button>
        <button id="tap-finish-btn" class="btn btn-primary" disabled>LRC 만들기</button>
      </div>

      <p class="tap-hint">음원을 재생하다가 화면의 굵은 줄이 실제로 나오는 순간 스페이스바(또는 TAP 버튼)를 누르세요. 실수하면 되돌리기로 취소할 수 있어요.</p>
    </div>
  </div>

<script>
const STORAGE_KEY = 'lp:songs';

function readSongs() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    const parsed = raw ? JSON.parse(raw) : [];
    return Array.isArray(parsed) ? parsed : [];
  } catch (err) {
    return [];
  }
}

function writeSongs(list) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
}

function uid() {
  if (window.crypto && typeof window.crypto.randomUUID === 'function') {
    return window.crypto.randomUUID();
  }
  return `${Date.now()}-${Math.random().toString(16).slice(2)}`;
}

// LRC 텍스트("[00:12.34]가사 줄")를 { time(초), text } 배열로 파싱
function parseLRC(text) {
  const timeTag = /\[(\d{1,2}):(\d{2})(?:[.:](\d{1,3}))?\]/g;
  const lines = (text || '').split(/\r?\n/);
  const result = [];
  for (const rawLine of lines) {
    const tags = [...rawLine.matchAll(timeTag)];
    if (tags.length === 0) continue;
    const content = rawLine.replace(timeTag, '').trim();
    for (const m of tags) {
      const min = parseInt(m[1], 10);
      const sec = parseInt(m[2], 10);
      const frac = parseInt((m[3] || '0').padEnd(3, '0').slice(0, 3), 10);
      result.push({ time: min * 60 + sec + frac / 1000, text: content });
    }
  }
  result.sort((a, b) => a.time - b.time);
  return result;
}

const SongStorage = {
  getAll() {
    return readSongs().sort((a, b) => a.title.localeCompare(b.title, 'ko'));
  },
  getById(id) {
    return readSongs().find((s) => s.id === id) || null;
  },
  add({ title, artist, lyrics, lrc }) {
    const list = readSongs();
    const now = new Date().toISOString();
    const song = {
      id: uid(),
      title: (title || '').trim() || '제목 없음',
      artist: (artist || '').trim(),
      lyrics: lyrics || '',
      lrc: lrc || '',
      createdAt: now,
      updatedAt: now,
    };
    list.push(song);
    writeSongs(list);
    return song;
  },
  update(id, patch) {
    const list = readSongs();
    const song = list.find((s) => s.id === id);
    if (!song) return null;
    if (typeof patch.title === 'string') song.title = patch.title.trim() || '제목 없음';
    if (typeof patch.artist === 'string') song.artist = patch.artist.trim();
    if (typeof patch.lyrics === 'string') song.lyrics = patch.lyrics;
    if (typeof patch.lrc === 'string') song.lrc = patch.lrc;
    song.updatedAt = new Date().toISOString();
    writeSongs(list);
    return song;
  },
  remove(id) {
    const list = readSongs();
    const idx = list.findIndex((s) => s.id === id);
    if (idx === -1) return false;
    list.splice(idx, 1);
    writeSongs(list);
    return true;
  },
};

const songListEl = document.getElementById('song-list');
const searchInputEl = document.getElementById('search-input');
const titleInputEl = document.getElementById('title-input');
const artistInputEl = document.getElementById('artist-input');
const lyricsInputEl = document.getElementById('lyrics-input');
const lrcInputEl = document.getElementById('lrc-input');
const lrcStatusEl = document.getElementById('lrc-status');
const searchLrcBtn = document.getElementById('search-lrc-btn');
const audioFileInputEl = document.getElementById('audio-file-input');
const audioFileNameEl = document.getElementById('audio-file-name');
const audioTransportEl = document.getElementById('audio-transport');
const audioPlayerEl = document.getElementById('audio-player');
const startTapSyncBtn = document.getElementById('start-tap-sync-btn');
const tapSyncModal = document.getElementById('tap-sync-modal');
const tapCloseBtn = document.getElementById('tap-close-btn');
const tapProgressLabel = document.getElementById('tap-progress-label');
const tapSpeedSelect = document.getElementById('tap-speed-select');
const syncAudioEl = document.getElementById('sync-audio');
const tapLinePrevEl = document.getElementById('tap-line-prev');
const tapLineCurrentEl = document.getElementById('tap-line-current');
const tapLineNextEl = document.getElementById('tap-line-next');
const tapUndoBtn = document.getElementById('tap-undo-btn');
const tapResetBtn = document.getElementById('tap-reset-btn');
const tapBtn = document.getElementById('tap-btn');
const tapFinishBtn = document.getElementById('tap-finish-btn');
const newSongBtn = document.getElementById('new-song-btn');
const searchLyricsBtn = document.getElementById('search-lyrics-btn');
const searchStatusEl = document.getElementById('search-status');
const saveBtn = document.getElementById('save-btn');
const deleteBtn = document.getElementById('delete-btn');
const sendBtn = document.getElementById('send-btn');
const clearPrompterBtn = document.getElementById('clear-prompter-btn');
const openPrompterBtn = document.getElementById('open-prompter-btn');
const fontMinusBtn = document.getElementById('font-minus-btn');
const fontPlusBtn = document.getElementById('font-plus-btn');
const fontSizeLabel = document.getElementById('font-size-label');
const nowShowingEl = document.getElementById('now-showing');
const promptStatusWrap = nowShowingEl.parentElement;

const MIN_FONT = 28;
const MAX_FONT = 140;
const FONT_STEP = 4;

let songs = [];
let selectedId = null;
let onAirSong = null;
let fontSize = 64;
let prompterWin = null;

// 브라우저 메모리에만 유지 (새로고침하면 사라짐) - songId -> File
const audioFiles = {};

function refreshSongs() {
  songs = SongStorage.getAll();
  renderList();
}

function renderList() {
  const query = searchInputEl.value.trim().toLowerCase();
  const filtered = query ? songs.filter((s) => s.title.toLowerCase().includes(query)) : songs;

  songListEl.innerHTML = '';
  for (const song of filtered) {
    const li = document.createElement('li');
    li.className = 'song-item';
    if (song.id === selectedId) li.classList.add('active');
    if (onAirSong && song.id === onAirSong.id) li.classList.add('on-air');

    const titleSpan = document.createElement('span');
    titleSpan.className = 'song-title';
    titleSpan.textContent = song.title;
    li.appendChild(titleSpan);

    if (onAirSong && song.id === onAirSong.id) {
      const badge = document.createElement('span');
      badge.className = 'song-item-live-badge';
      badge.textContent = 'LIVE';
      li.appendChild(badge);
    }

    li.addEventListener('click', () => selectSong(song.id));
    li.addEventListener('dblclick', () => sendToPrompter(song.id));
    songListEl.appendChild(li);
  }
}

function selectSong(id) {
  const song = songs.find((s) => s.id === id);
  if (!song) return;
  selectedId = id;
  titleInputEl.value = song.title;
  artistInputEl.value = song.artist || '';
  lyricsInputEl.value = song.lyrics;
  lrcInputEl.value = song.lrc || '';
  deleteBtn.hidden = false;
  setSearchStatus('');
  setLrcStatus('');
  updateAudioFileLabel(id);
  renderList();
}

function startNewSong() {
  selectedId = null;
  titleInputEl.value = '';
  artistInputEl.value = '';
  lyricsInputEl.value = '';
  lrcInputEl.value = '';
  deleteBtn.hidden = true;
  setSearchStatus('');
  setLrcStatus('');
  updateAudioFileLabel(null);
  titleInputEl.focus();
  renderList();
}

function saveSong() {
  const title = titleInputEl.value.trim();
  if (!title) {
    titleInputEl.focus();
    return null;
  }
  const artist = artistInputEl.value.trim();
  const lyrics = lyricsInputEl.value;
  const lrc = lrcInputEl.value;
  let song;
  if (selectedId) {
    song = SongStorage.update(selectedId, { title, artist, lyrics, lrc });
  } else {
    song = SongStorage.add({ title, artist, lyrics, lrc });
    selectedId = song.id;
    deleteBtn.hidden = false;
  }
  refreshSongs();
  return song;
}

function updateAudioFileLabel(songId) {
  const file = songId ? audioFiles[songId] : null;
  audioFileNameEl.textContent = file
    ? `첨부됨: ${file.name}`
    : '첨부된 음원 없음 (새로고침하면 다시 선택해야 해요)';
}

function setLrcStatus(text, kind) {
  if (!text) {
    lrcStatusEl.hidden = true;
    lrcStatusEl.textContent = '';
    return;
  }
  lrcStatusEl.hidden = false;
  lrcStatusEl.textContent = text;
  lrcStatusEl.className = `search-status ${kind || ''}`.trim();
}

async function searchSyncedLyricsOnline() {
  const title = titleInputEl.value.trim();
  const artist = artistInputEl.value.trim();

  if (!title || !artist) {
    (title ? artistInputEl : titleInputEl).focus();
    setLrcStatus('제목과 가수를 모두 입력해야 싱크 가사를 검색할 수 있어요.', 'error');
    return;
  }

  searchLrcBtn.disabled = true;
  setLrcStatus('싱크 가사 검색 중...');

  try {
    const url = `https://lrclib.net/api/get?artist_name=${encodeURIComponent(artist)}&track_name=${encodeURIComponent(title)}`;
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 8000);
    let response;
    try {
      response = await fetch(url, { signal: controller.signal });
    } finally {
      clearTimeout(timeoutId);
    }

    if (!response.ok) throw new Error('lrc-not-found');
    const data = await response.json();
    if (!data.syncedLyrics) throw new Error('lrc-empty');

    lrcInputEl.value = data.syncedLyrics.trim();
    setLrcStatus('싱크 가사를 찾았어요. 확인 후 저장하세요.', 'success');
  } catch (err) {
    setLrcStatus(
      '싱크 가사를 찾지 못했어요. .lrc 파일이 있다면 그 내용을 위 칸에 직접 붙여넣어보세요.',
      'error'
    );
  } finally {
    searchLrcBtn.disabled = false;
  }
}

function setAudioPlayerForSong(songId) {
  if (audioPlayerEl.dataset.objectUrl) {
    URL.revokeObjectURL(audioPlayerEl.dataset.objectUrl);
    delete audioPlayerEl.dataset.objectUrl;
  }
  const file = songId ? audioFiles[songId] : null;
  if (file) {
    const url = URL.createObjectURL(file);
    audioPlayerEl.src = url;
    audioPlayerEl.dataset.objectUrl = url;
    audioTransportEl.hidden = false;
  } else {
    audioPlayerEl.removeAttribute('src');
    audioPlayerEl.load();
    audioTransportEl.hidden = true;
  }
}

audioFileInputEl.addEventListener('change', () => {
  const file = audioFileInputEl.files[0];
  if (!file) return;

  let id = selectedId;
  if (!id) {
    const song = saveSong();
    if (!song) {
      audioFileInputEl.value = '';
      return;
    }
    id = song.id;
  }

  audioFiles[id] = file;
  updateAudioFileLabel(id);
  if (onAirSong && onAirSong.id === id) {
    setAudioPlayerForSong(id);
  }
  audioFileInputEl.value = '';
});

audioPlayerEl.addEventListener('timeupdate', () => {
  if (onAirSong && onAirSong.syncedLyrics && onAirSong.syncedLyrics.length) {
    postToPrompter({ type: 'audioTime', time: audioPlayerEl.currentTime });
  }
});

searchLrcBtn.addEventListener('click', searchSyncedLyricsOnline);

// --- 탭으로 싱크 찍기 ---
let tapLines = [];
let tapResults = [];
let tapAudioObjectUrl = null;

function startTapSync() {
  const lines = lyricsInputEl.value
    .split(/\r?\n/)
    .map((l) => l.trim())
    .filter((l) => l.length > 0);

  if (lines.length === 0) {
    setLrcStatus('먼저 가사를 입력해야 탭으로 싱크를 찍을 수 있어요.', 'error');
    return;
  }

  let id = selectedId;
  if (!id) {
    const song = saveSong();
    if (!song) return;
    id = song.id;
  }

  const file = audioFiles[id];
  if (!file) {
    setLrcStatus('먼저 "음원 파일 선택"으로 음원을 첨부해야 탭으로 싱크를 찍을 수 있어요.', 'error');
    return;
  }

  if (document.activeElement) document.activeElement.blur();

  tapLines = lines;
  tapResults = [];

  if (tapAudioObjectUrl) URL.revokeObjectURL(tapAudioObjectUrl);
  tapAudioObjectUrl = URL.createObjectURL(file);
  syncAudioEl.src = tapAudioObjectUrl;
  syncAudioEl.currentTime = 0;
  syncAudioEl.playbackRate = Number(tapSpeedSelect.value);

  tapSyncModal.hidden = false;
  updateTapDisplay();
}

function updateTapDisplay() {
  const idx = tapResults.length;
  tapProgressLabel.textContent = `${idx} / ${tapLines.length}줄`;
  tapLinePrevEl.textContent = idx > 0 ? tapLines[idx - 1] : '';
  tapLineCurrentEl.textContent = idx < tapLines.length ? tapLines[idx] : '(완료! "LRC 만들기"를 누르세요)';
  tapLineNextEl.textContent = idx + 1 < tapLines.length ? tapLines[idx + 1] : '';
  tapBtn.disabled = idx >= tapLines.length;
  tapFinishBtn.disabled = tapResults.length === 0;
}

function formatLrcTime(totalSeconds) {
  const mins = Math.floor(totalSeconds / 60);
  const secs = totalSeconds - mins * 60;
  return `${String(mins).padStart(2, '0')}:${secs.toFixed(2).padStart(5, '0')}`;
}

function doTap() {
  if (tapSyncModal.hidden || tapResults.length >= tapLines.length) return;
  const text = tapLines[tapResults.length];
  tapResults.push({ time: syncAudioEl.currentTime, text });
  updateTapDisplay();
}

function undoTap() {
  if (tapSyncModal.hidden || tapResults.length === 0) return;
  tapResults.pop();
  updateTapDisplay();
}

function resetTap() {
  tapResults = [];
  syncAudioEl.currentTime = 0;
  syncAudioEl.pause();
  updateTapDisplay();
}

function finishTapSync() {
  const lrcText = tapResults.map((r) => `[${formatLrcTime(r.time)}]${r.text}`).join('\n');
  lrcInputEl.value = lrcText;
  setLrcStatus(`탭으로 ${tapResults.length}줄 싱크를 만들었어요. 확인 후 저장하세요.`, 'success');
  closeTapSync();
}

function closeTapSync() {
  tapSyncModal.hidden = true;
  syncAudioEl.pause();
  syncAudioEl.removeAttribute('src');
  syncAudioEl.load();
  if (tapAudioObjectUrl) {
    URL.revokeObjectURL(tapAudioObjectUrl);
    tapAudioObjectUrl = null;
  }
}

startTapSyncBtn.addEventListener('click', startTapSync);
tapCloseBtn.addEventListener('click', closeTapSync);
tapBtn.addEventListener('click', doTap);
tapUndoBtn.addEventListener('click', undoTap);
tapResetBtn.addEventListener('click', resetTap);
tapFinishBtn.addEventListener('click', finishTapSync);
tapSpeedSelect.addEventListener('change', () => {
  syncAudioEl.playbackRate = Number(tapSpeedSelect.value);
});

document.addEventListener('keydown', (e) => {
  if (tapSyncModal.hidden) return;
  const tag = document.activeElement && document.activeElement.tagName;
  if (tag === 'INPUT' || tag === 'TEXTAREA') return;

  if (e.code === 'Space') {
    e.preventDefault();
    doTap();
  } else if (e.key === 'Backspace') {
    e.preventDefault();
    undoTap();
  } else if (e.key === 'Escape') {
    e.preventDefault();
    closeTapSync();
  }
});

function setSearchStatus(text, kind) {
  if (!text) {
    searchStatusEl.hidden = true;
    searchStatusEl.textContent = '';
    return;
  }
  searchStatusEl.hidden = false;
  searchStatusEl.textContent = text;
  searchStatusEl.className = `search-status ${kind || ''}`.trim();
}

async function searchLyricsOnline() {
  const title = titleInputEl.value.trim();
  const artist = artistInputEl.value.trim();

  if (!title) {
    titleInputEl.focus();
    setSearchStatus('곡 제목을 먼저 입력해주세요.', 'error');
    return;
  }
  if (!artist) {
    artistInputEl.focus();
    setSearchStatus('가수 이름도 입력해야 검색할 수 있어요.', 'error');
    return;
  }

  searchLyricsBtn.disabled = true;
  setSearchStatus('가사 검색 중...');

  try {
    const url = `https://api.lyrics.ovh/v1/${encodeURIComponent(artist)}/${encodeURIComponent(title)}`;
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 8000);
    let response;
    try {
      response = await fetch(url, { signal: controller.signal });
    } finally {
      clearTimeout(timeoutId);
    }

    if (!response.ok) throw new Error('lyrics-not-found');
    const data = await response.json();
    if (!data.lyrics) throw new Error('lyrics-empty');

    lyricsInputEl.value = data.lyrics.trim();
    setSearchStatus('가사를 찾아서 채워넣었어요. 내용을 확인한 뒤 저장하세요.', 'success');
  } catch (err) {
    setSearchStatus(
      '가사를 찾지 못했어요 (국내 가요는 지원이 잘 안 될 수 있습니다). 아래에 직접 입력/붙여넣기 해주세요.',
      'error'
    );
  } finally {
    searchLyricsBtn.disabled = false;
  }
}

function deleteSong() {
  if (!selectedId) return;
  const song = songs.find((s) => s.id === selectedId);
  const ok = confirm(`"${song ? song.title : '이 곡'}"을(를) 삭제할까요?`);
  if (!ok) return;

  if (onAirSong && onAirSong.id === selectedId) {
    postToPrompter({ type: 'clear' });
    onAirSong = null;
    setOnAirStatus(null);
  }
  SongStorage.remove(selectedId);
  startNewSong();
  refreshSongs();
}

function setOnAirStatus(title) {
  if (title) {
    nowShowingEl.textContent = `프롬프터: "${title}" 표시 중`;
    promptStatusWrap.classList.add('live');
  } else {
    nowShowingEl.textContent = '프롬프터: 대기 중';
    promptStatusWrap.classList.remove('live');
  }
}

function postToPrompter(message) {
  if (prompterWin && !prompterWin.closed) {
    prompterWin.postMessage(message, '*');
  }
}

async function openPrompterWindow() {
  if (prompterWin && !prompterWin.closed) {
    prompterWin.focus();
    return;
  }

  let features = 'width=1280,height=720';

  if ('getScreenDetails' in window) {
    try {
      const details = await window.getScreenDetails();
      const current = details.currentScreen;
      const secondary = details.screens.find((s) => s !== current);
      if (secondary) {
        features = `left=${secondary.availLeft},top=${secondary.availTop},width=${secondary.availWidth},height=${secondary.availHeight}`;
      }
    } catch (err) {
      // 권한 거부 또는 미지원 브라우저 - 기본 창으로 폴백
    }
  }

  prompterWin = window.open('prompter.html', 'lyrics-prompter-window', features);
}

function sendToPrompter(idOverride) {
  const id = idOverride || selectedId;
  if (!id) return;
  const song = id === selectedId ? saveSong() : SongStorage.getById(id);
  if (!song) return;

  const syncedLyrics = song.lrc ? parseLRC(song.lrc) : [];
  onAirSong = { ...song, syncedLyrics };
  setOnAirStatus(song.title);
  renderList();
  setAudioPlayerForSong(song.id);

  openPrompterWindow().then(() => {
    postToPrompter({ type: 'show', song: onAirSong, fontSize });
  });
}

function clearPrompter() {
  postToPrompter({ type: 'clear' });
  audioPlayerEl.pause();
  onAirSong = null;
  setOnAirStatus(null);
  renderList();
}

function changeFontSize(delta) {
  fontSize = Math.min(MAX_FONT, Math.max(MIN_FONT, fontSize + delta));
  fontSizeLabel.textContent = `${fontSize}px`;
  postToPrompter({ type: 'fontSize', size: fontSize });
}

// 프롬프터 창이 (재)로딩되어 "준비 완료" 신호를 보내오면 현재 상태를 다시 보내줌
window.addEventListener('message', (e) => {
  if (!e.data || e.data.type !== 'ready') return;
  if (e.source !== prompterWin) return;
  if (onAirSong) {
    postToPrompter({ type: 'show', song: onAirSong, fontSize });
  } else {
    postToPrompter({ type: 'fontSize', size: fontSize });
  }
});

newSongBtn.addEventListener('click', startNewSong);
searchLyricsBtn.addEventListener('click', searchLyricsOnline);
saveBtn.addEventListener('click', saveSong);
deleteBtn.addEventListener('click', deleteSong);
sendBtn.addEventListener('click', () => sendToPrompter());
clearPrompterBtn.addEventListener('click', clearPrompter);
openPrompterBtn.addEventListener('click', openPrompterWindow);
fontMinusBtn.addEventListener('click', () => changeFontSize(-FONT_STEP));
fontPlusBtn.addEventListener('click', () => changeFontSize(FONT_STEP));
searchInputEl.addEventListener('input', renderList);

document.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key === 's') {
    e.preventDefault();
    saveSong();
  }
});

fontSizeLabel.textContent = `${fontSize}px`;
refreshSongs();
</script>
</body>
