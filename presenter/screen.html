<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>유캔 프리젠터 — 발표 화면</title>
<link rel="stylesheet" href="css/presenter.css">
</head>
<body class="viewer">

<!-- 전체화면 안내 (브라우저는 사용자 제스처 없이 전체화면을 허용하지 않음) -->
<div class="fs-hint" id="fsHint">
  <div class="box">
    <div class="role" id="fsRole">SCREEN</div>
    <h1>이 화면을 클릭하세요</h1>
    <p>클릭 또는 <kbd>F</kbd> 를 누르면 전체화면으로 전환됩니다.</p>
  </div>
</div>

<section class="screen" id="screen">

  <!-- 발표 내용 (PDF 렌더 또는 라이브 캡처) -->
  <div class="content" id="content">
    <canvas id="vCanvas"></canvas>
    <video id="vVideo" muted playsinline hidden></video>
  </div>

  <div class="logo"><img src="../assets/logo.png" alt=""></div>

  <!-- 오버레이: 전부 발표 내용 위에 얹힌다 -->
  <div class="pacing" id="pacing" hidden><i></i></div>

  <div class="t-overlay" id="tOverlay" hidden>
    <div class="drag-tip" id="dragTip">드래그해서 위치 이동</div>
    <div class="t-val" id="tVal">15:00</div>
    <div class="t-clock" id="tClock" hidden>--:--:--</div>
  </div>

  <div class="next-overlay" id="nextOverlay" hidden>
    <img id="nextThumb" alt="">
    <span class="cap">다음</span>
  </div>

  <div class="badge-counter" id="sCounter" hidden>– / –</div>

  <div class="msg-overlay" id="msg"></div>
</section>

<div class="waiting" id="waiting">
  <div class="in">
    <b>컨트롤 콘솔 대기 중</b>
    소스를 선택하면 이 화면에 표시됩니다.
  </div>
</div>

<script type="module" src="js/viewer.js"></script>
</body>
</html>
