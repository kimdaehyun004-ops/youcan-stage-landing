<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>퀴즈쇼 스크린</title>
<link rel="stylesheet" href="/quiz/quiz.css">
<style>
  html, body { height: 100%; overflow: hidden; }
  .stage {
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px;
    text-align: center;
    position: relative;
  }
  .top-bar {
    position: absolute; top: 24px; left: 24px; right: 24px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .brand { font-weight: 800; letter-spacing: .04em; color: var(--muted); font-size: 14px; }

  .view { display: none; width: 100%; max-width: 1100px; }
  .view.active { display: flex; flex-direction: column; align-items: center; }

  /* lobby */
  #view-lobby img { width: 260px; height: 260px; border-radius: 20px; background: #fff; margin-bottom: 20px; }
  #view-lobby h1 { font-size: 40px; margin: 0 0 6px; }
  #view-lobby p { color: var(--muted); font-size: 18px; }
  #lobby-count { font-size: 22px; color: var(--accent); font-weight: 800; margin-top: 10px; }

  /* question */
  .q-number { font-size: 16px; color: var(--muted); font-weight: 700; margin-bottom: 12px; }
  .q-text { font-size: 40px; font-weight: 800; margin-bottom: 30px; line-height: 1.35; }
  .q-timer { width: 100%; max-width: 700px; margin-bottom: 26px; }
  .q-timer-num { font-size: 14px; color: var(--muted); margin-bottom: 6px; }
  .q-choices { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; width: 100%; max-width: 900px; }
  .q-choices .choice-btn { font-size: 22px; padding: 26px 24px; pointer-events: none; }
  .reveal-stats { margin-top: 22px; font-size: 18px; color: var(--muted); }
  .reveal-stats b { color: var(--accent); }

  /* leaderboard */
  #view-leaderboard h2 { font-size: 30px; margin-bottom: 24px; }
  .board-wide { width: 100%; max-width: 720px; }
  .board-wide .leaderboard-row { padding: 16px 22px; }
  .board-wide .rank { width: 42px; height: 42px; font-size: 18px; }
  .board-wide .name { font-size: 20px; }
  .board-wide .score { font-size: 24px; }

  /* roulette */
  .wheel-outer { position: relative; }
  .roulette-wheel { width: 380px; height: 380px; }
  .roulette-result { margin-top: 28px; font-size: 28px; font-weight: 800; opacity: 0; transition: opacity .4s ease; }
  .roulette-result.show { opacity: 1; }
  .roulette-result .prize { color: var(--accent); }

  /* final */
  #view-final h2 { font-size: 22px; color: var(--muted); margin-bottom: 30px; letter-spacing: .1em; }
  .final-podium { display: flex; align-items: flex-end; gap: 24px; margin-top: 10px; }
  .final-podium .slot { text-align: center; }
  .final-podium .slot .crown { font-size: 34px; }
  .final-podium .slot .box { width: 160px; border-radius: 12px 12px 0 0; background: var(--panel-2); border: 1px solid var(--border); padding: 18px 10px; }
  .final-podium .slot.rank1 .box { background: var(--accent); color: var(--accent-ink); height: 180px; }
  .final-podium .slot.rank2 .box { height: 130px; }
  .final-podium .slot.rank3 .box { height: 100px; }
  .final-podium .team { font-size: 13px; opacity: .8; }
  .final-podium .name { font-size: 20px; font-weight: 800; margin: 6px 0; }
  .final-podium .score { font-size: 16px; font-weight: 700; }

  .confetti { position: fixed; top: -20px; width: 10px; height: 16px; opacity: .9; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(110vh) rotate(600deg); } }
</style>
</head>
<body>
<div class="stage">
  <div class="top-bar">
    <span class="brand">🎤 온라인 퀴즈쇼</span>
    <span class="pill live" id="players-badge">참가자 0명</span>
  </div>

  <div id="view-lobby" class="view active">
    <img src="/api/quiz/qr" alt="참가 QR코드">
    <h1>QR코드를 스캔해서 참가하세요</h1>
    <p>소속과 이름을 입력하면 바로 접속됩니다</p>
    <div id="lobby-count">0명 참가중</div>
  </div>

  <div id="view-question" class="view">
    <div class="q-number" id="q-number"></div>
    <div class="q-text" id="q-text"></div>
    <div class="q-timer">
      <div class="q-timer-num" id="q-timer-num"></div>
      <div class="timer-bar"><div class="timer-bar-fill" id="timer-fill" style="width:100%;"></div></div>
    </div>
    <div class="q-choices choice-colors" id="q-choices"></div>
    <div class="reveal-stats" id="reveal-stats"></div>
  </div>

  <div id="view-leaderboard" class="view">
    <h2>🏆 실시간 순위</h2>
    <div class="leaderboard board-wide" id="board-list"></div>
  </div>

  <div id="view-roulette" class="view">
    <h2 style="font-size:28px;margin-bottom:24px;">🎡 상품 룰렛</h2>
    <div class="wheel-outer">
      <div class="roulette-pointer"></div>
      <svg class="roulette-wheel" id="wheel-svg" viewBox="0 0 200 200"></svg>
    </div>
    <div class="roulette-result" id="roulette-result"></div>
  </div>

  <div id="view-final" class="view">
    <h2>FINAL RESULT</h2>
    <div class="final-podium" id="final-podium"></div>
  </div>
</div>

<script src="/quiz/display.js"></script>
</body>
</html>
