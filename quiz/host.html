<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>진행자 화면 | 온라인 퀴즈쇼</title>
<link rel="stylesheet" href="/quiz/quiz.css">
<style>
  .wrap { max-width: 960px; margin: 0 auto; padding: 32px 20px 100px; }
  .top-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
  h1 { font-size: 20px; margin: 0; }
  a.back { color: var(--muted); text-decoration: none; font-size: 13px; }
  .login-form { max-width: 340px; margin: 90px auto 0; }
  .tabs { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
  .tab-btn { background: transparent; border: 1px solid var(--border); color: var(--muted); border-radius: 999px; padding: 9px 16px; font-size: 13px; }
  .tab-btn.active { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .panel { display: none; }
  .panel.active { display: block; }
  .status-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px,1fr)); gap: 12px; margin-bottom: 16px; }
  .stat { background: var(--panel-2); border: 1px solid var(--border); border-radius: 12px; padding: 14px; text-align: center; }
  .stat .num { font-size: 24px; font-weight: 800; color: var(--accent); }
  .stat .label { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .control-row { display: flex; gap: 10px; flex-wrap: wrap; margin: 16px 0; }
  .qr-box { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  .qr-box img { width: 140px; height: 140px; border-radius: 12px; background: #fff; }
  .qr-box .join-url { font-size: 13px; color: var(--muted); word-break: break-all; }
  .q-form { display: grid; gap: 10px; margin-bottom: 24px; }
  .choice-row { display: flex; align-items: center; gap: 8px; }
  .choice-row input[type=text] { flex: 1; }
  .list-item { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 14px; background: var(--panel-2); border: 1px solid var(--border); border-radius: 10px; margin-bottom: 8px; }
  .list-item .meta { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .section-title { font-size: 14px; font-weight: 700; color: var(--muted); margin: 0 0 10px; }
  .row-inline { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .danger-zone { margin-top: 40px; padding-top: 20px; border-top: 1px dashed var(--border); }
</style>
</head>
<body>
<div class="wrap">
  <div class="top-row">
    <div>
      <a class="back" href="/">← 홈으로</a>
      <h1 style="margin-top:8px;">🎤 진행자 조작 화면</h1>
    </div>
    <button class="secondary" id="logout-btn" style="display:none;">로그아웃</button>
  </div>

  <div id="login-view" class="card login-form">
    <p style="margin:0 0 16px;color:var(--muted);font-size:14px;">관리자 비밀번호를 입력하세요.</p>
    <input id="password" type="password" placeholder="비밀번호" autocomplete="current-password">
    <button id="login-btn" style="width:100%;margin-top:10px;">로그인</button>
    <p id="login-error" class="error-text"></p>
  </div>

  <div id="app-view" style="display:none;">
    <div class="status-grid">
      <div class="stat"><div class="num" id="stat-players">0</div><div class="label">참가자</div></div>
      <div class="stat"><div class="num" id="stat-qnum">-</div><div class="label">진행 문제</div></div>
      <div class="stat"><div class="num" id="stat-phase">대기중</div><div class="label">현재 단계</div></div>
      <div class="stat"><div class="num" id="stat-view">-</div><div class="label">화면</div></div>
    </div>

    <div class="tabs">
      <button class="tab-btn active" data-tab="control">진행 컨트롤</button>
      <button class="tab-btn" data-tab="questions">문제 관리</button>
      <button class="tab-btn" data-tab="prizes">상품 · 룰렛</button>
      <button class="tab-btn" data-tab="players">참가자</button>
    </div>

    <div id="tab-control" class="panel active card">
      <p class="section-title">참가 QR코드</p>
      <div class="qr-box">
        <img src="/api/quiz/qr" alt="참가 QR코드">
        <div class="join-url" id="join-url"></div>
      </div>

      <p class="section-title" style="margin-top:24px;">현재 문제</p>
      <div id="current-question-box" class="card" style="background:var(--panel-2);">
        <div style="color:var(--muted);font-size:14px;">아직 출제 전입니다.</div>
      </div>

      <div class="control-row">
        <button id="btn-next-question">▶ 다음 문제 출제</button>
        <button id="btn-reveal" class="secondary">✅ 정답 공개</button>
        <button id="btn-view-leaderboard" class="secondary">🏆 중간 순위 화면</button>
        <button id="btn-view-question" class="secondary">📋 문제 화면으로</button>
        <button id="btn-view-final" class="secondary">👑 최종 1등 발표</button>
      </div>

      <div class="danger-zone">
        <p class="section-title">게임 초기화</p>
        <p style="color:var(--muted);font-size:13px;">참가자·점수·진행 상태를 모두 초기화합니다. 등록된 문제/상품은 유지됩니다.</p>
        <button class="danger" id="btn-reset">전체 초기화</button>
      </div>
    </div>

    <div id="tab-questions" class="panel card">
      <p class="section-title">문제 추가</p>
      <div class="q-form">
        <input id="q-text" type="text" placeholder="문제 내용">
        <div id="q-choices"></div>
        <button type="button" class="secondary" id="btn-add-choice" style="width:fit-content;">+ 보기 추가</button>
        <div class="row-inline">
          <label style="font-size:13px;color:var(--muted);">배점
            <input id="q-points" type="number" value="10" min="1" style="width:80px;display:inline-block;margin-left:6px;">
          </label>
          <label style="font-size:13px;color:var(--muted);">제한시간(초)
            <input id="q-time" type="number" value="20" min="5" style="width:80px;display:inline-block;margin-left:6px;">
          </label>
        </div>
        <p id="q-error" class="error-text"></p>
        <button id="btn-add-question" style="width:fit-content;">문제 등록</button>
      </div>

      <p class="section-title">등록된 문제 목록</p>
      <div id="question-list"></div>
    </div>

    <div id="tab-prizes" class="panel card">
      <p class="section-title">상품 추가</p>
      <div class="row-inline" style="margin-bottom:20px;">
        <input id="prize-label" type="text" placeholder="상품명" style="max-width:220px;">
        <input id="prize-stock" type="number" placeholder="수량" value="1" min="1" style="max-width:100px;">
        <button id="btn-add-prize">추가</button>
      </div>
      <p id="prize-error" class="error-text"></p>

      <p class="section-title">상품 목록</p>
      <div id="prize-list"></div>

      <p class="section-title" style="margin-top:24px;">룰렛 돌리기</p>
      <div class="row-inline">
        <select id="roulette-player" style="max-width:260px;"></select>
        <button id="btn-spin">🎡 룰렛 스핀</button>
      </div>
      <p id="roulette-result" style="margin-top:10px;font-size:14px;"></p>
    </div>

    <div id="tab-players" class="panel card">
      <p class="section-title">참가자 목록</p>
      <div id="player-list"></div>
    </div>
  </div>
</div>

<script src="/quiz/host.js"></script>
</body>
</html>
