<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>퀴즈 참가하기</title>
<link rel="stylesheet" href="/quiz/quiz.css">
<style>
  body { min-height: 100dvh; }
  .wrap { max-width: 480px; margin: 0 auto; padding: 24px 18px 60px; min-height: 100dvh; display: flex; flex-direction: column; }

  /* join */
  #join-view { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 14px; }
  #join-view h1 { font-size: 24px; margin: 0 0 4px; text-align: center; }
  #join-view p.sub { color: var(--muted); text-align: center; margin: 0 0 20px; font-size: 14px; }

  /* header */
  .me-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
  .me-bar .who { font-size: 13px; color: var(--muted); }
  .me-bar .who b { color: var(--text); }
  .me-bar .score { font-size: 18px; font-weight: 800; color: var(--accent); }

  #play-view { display: none; flex: 1; flex-direction: column; }

  .state-panel { flex: 1; display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 12px; }
  .state-panel.active { display: flex; }
  .state-panel .big-emoji { font-size: 44px; }
  .state-panel h2 { margin: 0; font-size: 20px; }
  .state-panel p { color: var(--muted); margin: 0; font-size: 14px; }

  /* question */
  #panel-question { justify-content: flex-start; padding-top: 6px; }
  .q-number { font-size: 12px; color: var(--muted); font-weight: 700; margin-bottom: 8px; }
  .q-text { font-size: 20px; font-weight: 800; margin-bottom: 16px; line-height: 1.4; text-align: left; width: 100%; }
  .q-timer-num { font-size: 13px; color: var(--muted); margin-bottom: 6px; text-align: right; }
  .timer-bar { margin-bottom: 18px; width: 100%; }
  .q-choices { display: grid; gap: 12px; width: 100%; }
  .q-choices .choice-btn { width: 100%; font-size: 16px; padding: 18px 16px; }
  .submitted-banner { margin-top: 16px; text-align: center; font-size: 15px; color: var(--muted); }
  .result-banner { margin-top: 16px; text-align: center; font-size: 18px; font-weight: 800; padding: 14px; border-radius: 12px; }
  .result-banner.correct { background: rgba(51,209,122,.15); color: var(--good); }
  .result-banner.wrong { background: rgba(255,107,107,.15); color: var(--bad); }

  /* leaderboard */
  #panel-leaderboard .rank-num { font-size: 46px; font-weight: 900; color: var(--accent); }
  #panel-leaderboard .rank-score { font-size: 16px; color: var(--muted); }

  /* final */
  #panel-final .rank-num { font-size: 46px; font-weight: 900; color: var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <div id="join-view">
    <h1>🎤 온라인 퀴즈쇼</h1>
    <p class="sub">소속과 이름을 입력하고 참가하세요</p>
    <input id="join-team" type="text" placeholder="소속 (예: 마케팅팀)" maxlength="40">
    <input id="join-name" type="text" placeholder="이름" maxlength="40">
    <button id="join-btn">참가하기</button>
    <p id="join-error" class="error-text" style="text-align:center;"></p>
  </div>

  <div id="play-view">
    <div class="me-bar">
      <div class="who"><b id="me-team"></b> · <span id="me-name"></span></div>
      <div class="score" id="me-score">0점</div>
    </div>

    <div id="panel-lobby" class="state-panel">
      <div class="big-emoji">⏳</div>
      <h2>곧 퀴즈가 시작됩니다</h2>
      <p>화면을 계속 보고 있어주세요</p>
    </div>

    <div id="panel-question" class="state-panel">
      <div class="q-number" id="q-number"></div>
      <div class="q-text" id="q-text"></div>
      <div class="q-timer-num" id="q-timer-num"></div>
      <div class="timer-bar"><div class="timer-bar-fill" id="timer-fill" style="width:100%;"></div></div>
      <div class="q-choices choice-colors" id="q-choices"></div>
      <div id="submitted-banner" class="submitted-banner" style="display:none;">제출 완료! 결과를 기다려주세요</div>
      <div id="result-banner" class="result-banner" style="display:none;"></div>
    </div>

    <div id="panel-leaderboard" class="state-panel">
      <div class="big-emoji">🏆</div>
      <div class="rank-num" id="my-rank">-</div>
      <h2>현재 내 순위</h2>
      <p class="rank-score" id="my-rank-score">0점</p>
    </div>

    <div id="panel-roulette" class="state-panel">
      <div class="big-emoji">🎡</div>
      <h2 id="roulette-title">상품 룰렛 진행중</h2>
      <p id="roulette-desc">큰 화면을 확인해주세요</p>
    </div>

    <div id="panel-final" class="state-panel">
      <div class="big-emoji" id="final-emoji">🎉</div>
      <div class="rank-num" id="final-rank">-</div>
      <h2 id="final-title">최종 순위</h2>
      <p class="rank-score" id="final-score">0점</p>
    </div>
  </div>
</div>

<script src="/quiz/play.js"></script>
</body>
</html>
