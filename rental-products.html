      </a>

      <button class="menu-btn" aria-label="메뉴 열기">
        <span></span><span></span><span></span>
      </button>

      <nav class="desktop-nav">
        <a href="/about.html" class="nav-link">회사소개</a>
        <a href="/rental-products.html" class="nav-link active">렌탈상품</a>
        <a href="/system-items.html" class="nav-link">시스템품목</a>
        <a href="/gallery.html" class="nav-link">행사갤러리</a>
        <a href="/#contact" class="cta-btn">무료 견적 문의</a>
      </nav>
    </div>

    <nav class="mobile-nav">
      <a href="/about.html" class="nav-link">회사소개</a>
      <a href="/rental-products.html" class="nav-link active">렌탈상품</a>
      <a href="/system-items.html" class="nav-link">시스템품목</a>

  <div class="simple-page">
    <p class="eyebrow" style="display:block;margin:0 0 16px;">RENTAL PRODUCTS</p>
    <h1>렌탈상품</h1>
    <p class="lead">유캔스테이지가 보유한 렌탈 품목입니다. 품목을 선택하면 상세 사진과 안내를 확인할 수 있습니다.</p>

    <div class="rental-grid" id="rental-grid" style="margin-top:32px;"></div>
  </div>

  <footer class="site-footer">
    <div class="site-footer-inner">
      <p class="footer-links">개인정보처리방침<span class="sep">|</span>이용약관<span class="sep">|</span>이메일무단수집거부</p>
      <p class="footer-info">
        대표 : 김대현 &nbsp;|&nbsp; 주소 : 서울특별시 금천구 가산디지털1로 19, 1609호 유캔시스템<br>
        연락처 : 010-8986-8450 &nbsp;|&nbsp; 사업자등록번호 : 720-47-00808
      </p>
    </div>
  </footer>

</div>

<script src="/nav.js"></script>
<script src="/products.js"></script>
<script>
(function () {
  const grid = document.getElementById('rental-grid');
  const products = (window.PRODUCTS || []).filter((p) => p.category === 'rental');

  grid.innerHTML = products.map((product) => `
    <a class="product-card" href="/product.html?id=${encodeURIComponent(product.id)}">
      <div class="product-card-photo" data-product-photo="${product.id}">
        <span class="ph-label">PRODUCT</span>
      </div>
      <div class="product-card-body">
        <p class="product-card-name">${product.name}</p>
      </div>
    </a>
  `).join('');

  const slots = products.map((p) => `product-${p.id}`);
  fetch(`/api/photos?slots=${encodeURIComponent(slots.join(','))}`)
    .then((r) => r.json())
    .then((data) => {
      const photosBySlot = data.photosBySlot || {};
      products.forEach((product) => {
        const photos = photosBySlot[`product-${product.id}`] || [];
        if (photos.length === 0) return;
        const photoEl = grid.querySelector(`[data-product-photo="${product.id}"]`);
        if (photoEl) photoEl.innerHTML = `<img src="${photos[0].url}" alt="${product.name}">`;
      });
    })
    .catch(() => {});
})();
</script>
</body>
</html>
