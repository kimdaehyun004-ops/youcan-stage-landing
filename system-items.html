<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>시스템품목 | 유캔스테이지</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="page">

  <header class="site-header">
    <div class="header-inner">
      <a href="/" class="logo-link">
        <img src="/assets/logo.png" alt="유캔스테이지">
      </a>

      <button class="menu-btn" aria-label="메뉴 열기">
        <span></span><span></span><span></span>
      </button>

      <nav class="desktop-nav">
        <a href="/about.html" class="nav-link">회사소개</a>
        <a href="/rental-products.html" class="nav-link">렌탈상품</a>
        <a href="/system-items.html" class="nav-link active">시스템품목</a>
        <a href="/gallery.html" class="nav-link">행사갤러리</a>
        <a href="/#contact" class="cta-btn">무료 견적 문의</a>
      </nav>
    </div>

    <nav class="mobile-nav">
      <a href="/about.html" class="nav-link">회사소개</a>
      <a href="/rental-products.html" class="nav-link">렌탈상품</a>
      <a href="/system-items.html" class="nav-link active">시스템품목</a>
      <a href="/gallery.html" class="nav-link">행사갤러리</a>
      <a href="/#contact" class="cta-btn">무료 견적 문의</a>
    </nav>
  </header>

  <div class="simple-page">
    <p class="eyebrow" style="display:block;margin:0 0 16px;">SYSTEM ITEMS</p>
    <h1>시스템품목</h1>
    <p class="lead" style="margin-bottom:48px;">음향·조명·특효·중계 장비를 분야별로 확인할 수 있습니다.</p>

    <div class="system-section" data-slot="system-sound">
      <h2>음향</h2>
      <div class="gallery-grid"></div>
      <button type="button" class="gallery-more-btn" style="display:none;">더보기</button>
    </div>
    <div class="system-section" data-slot="system-light">
      <h2>조명</h2>
      <div class="gallery-grid"></div>
      <button type="button" class="gallery-more-btn" style="display:none;">더보기</button>
    </div>
    <div class="system-section" data-slot="system-effect">
      <h2>특효</h2>
      <div class="gallery-grid"></div>
      <button type="button" class="gallery-more-btn" style="display:none;">더보기</button>
    </div>
    <div class="system-section" data-slot="system-broadcast">
      <h2>중계</h2>
      <div class="gallery-grid"></div>
      <button type="button" class="gallery-more-btn" style="display:none;">더보기</button>
    </div>
  </div>

</div>

<script src="/nav.js"></script>
<script>
(function () {
  const columns = window.innerWidth <= 880 ? 2 : 4;
  const rowLimit = columns * 2;

  document.querySelectorAll('.system-section').forEach((section) => {
    const slot = section.dataset.slot;
    const grid = section.querySelector('.gallery-grid');
    const moreBtn = section.querySelector('.gallery-more-btn');

    fetch(`/api/photos?slot=${encodeURIComponent(slot)}`)
      .then((r) => r.json())
      .then((data) => {
        const photos = data.photos || [];
        if (photos.length === 0) {
          grid.innerHTML = '<p class="gallery-empty">등록된 사진이 없습니다.</p>';
          return;
        }
        grid.innerHTML = photos
          .map((p) => `<div class="gallery-photo"><img src="${p.url}" alt=""></div>`)
          .join('');

        if (photos.length > rowLimit) {
          Array.from(grid.children).slice(rowLimit).forEach((el) => {
            el.style.display = 'none';
          });
          moreBtn.style.display = 'inline-block';
          moreBtn.addEventListener('click', () => {
            Array.from(grid.children).forEach((el) => { el.style.display = ''; });
            moreBtn.style.display = 'none';
          });
        }
      })
      .catch(() => {
        grid.innerHTML = '<p class="gallery-empty">등록된 사진이 없습니다.</p>';
      });
  });
})();
</script>
</body>
</html>
